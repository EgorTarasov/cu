version: 2

project_name: cu

before:
  hooks:
    - go mod tidy

builds:
  - id: cu
    main: ./cmd/cli
    binary: cu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.ver={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: cu
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from CHANGELOG.md via --release-notes flag in the workflow.
# Disable the auto-generated commit-based changelog so we don't duplicate.
changelog:
  disable: true

release:
  github:
    owner: EgorTarasov
    name: cu
  draft: false
  prerelease: auto
  mode: replace
