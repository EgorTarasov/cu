name: Auto Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.VERSION }}
      skipped: ${{ steps.check.outputs.SKIP }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if already tagged
        id: check
        run: |
          if git describe --exact-match HEAD 2>/dev/null; then
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already tagged, skipping"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch version
        if: steps.check.outputs.SKIP == 'false'
        id: next
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEW="v0.1.0"
          else
            # Only bump patch — major.minor are set manually via GitHub releases
            NEW=$(echo "$LATEST" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          fi
          echo "VERSION=$NEW" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW"

      - name: Create and push tag
        if: steps.check.outputs.SKIP == 'false'
        run: |
          git tag "${{ steps.next.outputs.VERSION }}"
          git push origin "${{ steps.next.outputs.VERSION }}"

  # The tag above is pushed with the default GITHUB_TOKEN, and GitHub suppresses
  # workflow triggers for events it creates — so release.yml's `on: push: tags`
  # never fires for it. v0.1.6, v0.1.7 and v0.1.8 were all tagged and never
  # released because of this. Calling release.yml as a reusable workflow runs it
  # inside this same run, where no event trigger is involved.
  release:
    needs: tag
    if: needs.tag.outputs.skipped == 'false'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    secrets: inherit
